
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMELIA Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#ECE8E4;color:#302923}
.chat{width:min(390px,100%);height:620px;max-height:100vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 35px #0002}
.header{background:#ECE8E4;padding:22px 20px;border-bottom:1px solid #ded7d0}
.brand{font-family:Georgia,serif;letter-spacing:4px;font-size:20px}
.subtitle{font-size:12px;margin-top:7px;color:#756a61}
.messages{padding:18px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere;white-space:pre-line}
.bot{background:#F3F0ED;align-self:flex-start}
.user{background:#76604D;color:white;align-self:flex-end}
.msg a{color:#72533d;text-decoration:underline;overflow-wrap:anywhere}
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 12px}
.quick button{background:white;border:1px solid #cfc3b8;border-radius:20px;padding:8px 10px;cursor:pointer;color:#514235;font-size:12px}
.quick button:disabled,.inputrow button:disabled{opacity:.55;cursor:wait}
.inputrow{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}
.inputrow input{flex:1;min-width:0;border:1px solid #ddd;border-radius:22px;padding:12px;font-size:14px}
.inputrow button{border:0;background:#76604D;color:white;border-radius:50%;width:43px;height:43px;cursor:pointer;font-size:18px}
.note{text-align:center;font-size:10px;color:#887e75;padding:0 0 10px}
</style>
</head>
<body>
<div class="chat">
<header class="header">
  <div class="brand">SAMELIA</div>
  <div class="subtitle">Raíces que trascienden, joyas que perduran.</div>
</header>

<main class="messages" id="messages" aria-live="polite">
  <div class="msg bot">¡Hola! Bienvenido a SAMELIA. ✨ Estamos aquí para ayudarte a encontrar una joya especial. ¿Qué te gustaría saber?</div>
</main>

<div class="quick">
  <button type="button" onclick="quick('¿Qué materiales utilizan?')">Materiales</button>
  <button type="button" onclick="quick('¿Cómo funcionan los envíos?')">Envíos</button>
  <button type="button" onclick="quick('¿Qué métodos de pago aceptan?')">Pagos</button>
  <button type="button" onclick="quick('Quiero ayuda para elegir una joya')">Elegir una joya</button>
</div>

<form class="inputrow" id="form">
  <input id="entry" placeholder="Escribe tu pregunta..." autocomplete="off" required>
  <button id="sendButton" aria-label="Enviar mensaje" type="submit">➤</button>
</form>
<div class="note">Atención al cliente · SAMELIA</div>
</div>

<script>
const messages = document.getElementById('messages');
const entry = document.getElementById('entry');
const sendButton = document.getElementById('sendButton');

const links = {
  envios: 'https://samelia.co/policies/shipping-policy',
  reembolsos: 'https://samelia.co/policies/refund-policy',
  terminos: 'https://samelia.co/policies/terms-of-service',
  privacidad: 'https://samelia.co/policies/privacy-policy',
  instagram: 'https://www.instagram.com/samelia.plata925/',
  whatsapp: 'https://wa.me/573144729199',
  catalogo: 'https://samelia.co/collections/all'
};

const PRODUCTS_URL = 'https://samelia.co/products.json?limit=250';
const CACHE_MS = 60000;

let productsCache = null;
let productsCacheTime = 0;
let productsRequest = null;

let recommendationStep = '';
let recommendation = {
  recipient: '',
  category: '',
  budget: null
};

function normalize(value) {
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s$.,]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function add(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  String(text).split(/(https?:\/\/[^\s]+)/g).forEach(part => {
    if (/^https?:\/\//.test(part)) {
      const url = part.replace(/[.,!?]+$/, '');
      const a = document.createElement('a');
      a.href = url;
      a.textContent = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      div.appendChild(a);

      const punctuation = part.slice(url.length);
      if (punctuation) {
        div.appendChild(document.createTextNode(punctuation));
      }
    } else {
      div.appendChild(document.createTextNode(part));
    }
  });

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function quick(text) {
  entry.value = text;
  send();
}

function plainDescription(html) {
  const el = document.createElement('div');
  el.innerHTML = String(html || '');
  el.querySelectorAll('script,style,noscript').forEach(n => n.remove());
  return (el.textContent || '').replace(/\s+/g, ' ').trim();
}

async function getProducts() {
  if (productsCache && Date.now() - productsCacheTime < CACHE_MS) {
    return productsCache;
  }

  if (productsRequest) return productsRequest;

  productsRequest = (async () => {
    const response = await fetch(PRODUCTS_URL, {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('Shopify HTTP ' + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.products)) {
      throw new Error('Catálogo de Shopify no válido');
    }

    productsCache = data.products.map(p => {
      const variants = Array.isArray(p.variants) ? p.variants : [];
      const prices = variants
        .map(v => Number(v.price))
        .filter(n => Number.isFinite(n) && n >= 0);

      return {
        title: p.title || 'Producto SAMELIA',
        handle: p.handle || '',
        description: plainDescription(p.body_html || ''),
        tags: Array.isArray(p.tags) ? p.tags.join(' ') : '',
        price: prices.length ? Math.min(...prices) : null,
        available: variants.some(v => v.available === true)
      };
    });

    productsCacheTime = Date.now();
    return productsCache;
  })();

  try {
    return await productsRequest;
  } finally {
    productsRequest = null;
  }
}

function productUrl(product) {
  return product.handle
    ? 'https://samelia.co/products/' + encodeURIComponent(product.handle)
    : links.catalogo;
}

function money(value) {
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    maximumFractionDigits: 0
  }).format(value);
}

function productDetails(product) {
  let result = '✨ ' + product.title + '\n';

  result += product.available
    ? 'Disponible según el catálogo de Shopify.\n'
    : 'Shopify no marca este producto como disponible actualmente.\n';

  if (product.price !== null && product.price > 0) {
    result += 'Precio publicado: ' + money(product.price) + '.\n';
  } else {
    result += 'No pude confirmar un precio válido en el catálogo.\n';
  }

  if (product.description) {
    result += 'Descripción: ' + product.description.slice(0, 350);

    if (product.description.length > 350) {
      result += '…';
    }

    result += '\n';
  }

  result += 'Ver producto: ' + productUrl(product);
  return result;
}

const CATEGORY_TERMS = {
  cadena: ['cadena', 'cadenas', 'collar', 'collares', 'gargantilla', 'gargantillas'],
  collar: ['collar', 'collares', 'cadena', 'cadenas', 'gargantilla', 'gargantillas'],
  aretes: ['arete', 'aretes', 'pendiente', 'pendientes', 'candonga', 'candongas', 'topo', 'topos'],
  anillo: ['anillo', 'anillos', 'sortija', 'sortijas'],
  pulsera: ['pulsera', 'pulseras', 'brazalete', 'brazaletes'],
  tobillera: ['tobillera', 'tobilleras'],
  dije: ['dije', 'dijes', 'colgante', 'colgantes']
};

function categoryFrom(text) {
  const q = normalize(text);

  for (const [category, terms] of Object.entries(CATEGORY_TERMS)) {
    if (terms.some(term => new RegExp('\\b' + term + '\\b').test(q))) {
      return category;
    }
  }

  return '';
}

function productHasCategory(product, category) {
  const terms = CATEGORY_TERMS[category] || [category];
  const titleAndTags = normalize(product.title + ' ' + product.tags);

  return terms.some(term =>
    new RegExp('\\b' + term + '\\b').test(titleAndTags)
  );
}

const STOPWORDS = new Set([
  'cuanto','cuesta','cuestan','vale','valen','precio','precios','valor',
  'dime','decir','quiero','quisiera','busco','buscar','ver','mostrar',
  'muestra','tienes','tienen','hay','disponible','disponibilidad',
  'catalogo','producto','productos','joya','joyas','bonito','bonita',
  'hermoso','hermosa','especial','favor','por','una','uno','unas','unos',
  'que','cual','cuales','como','donde','de','del','la','el','las','los',
  'para','con','sin','en','mi','me','tu','su','es','son','esta','estan',
  'este','y','o','material','materiales','plata','925','oro','regalo',
  'regalar','recomienda','recomendar','ayuda','ayudar','elegir','saber',
  'informacion','sobre','tiene','tienen'
]);

function queryTerms(text) {
  return [...new Set(normalize(text).split(' ').filter(word =>
    word.length > 2 &&
    !STOPWORDS.has(word) &&
    !Object.values(CATEGORY_TERMS).flat().includes(word)
  ))];
}

function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;

  const row = Array.from({ length: b.length + 1 }, (_, i) => i);

  for (let i = 1; i <= a.length; i++) {
    let diagonal = row[0];
    row[0] = i;

    for (let j = 1; j <= b.length; j++) {
      const old = row[j];

      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        diagonal + (a[i - 1] === b[j - 1] ? 0 : 1)
      );

      diagonal = old;
    }
  }

  return row[b.length];
}

function titleScore(query, product) {
  const terms = queryTerms(query);

  const nameWords = normalize(
    product.title + ' ' + product.handle.replace(/-/g, ' ')
  ).split(' ');

  if (!terms.length) return 0;

  let matched = 0;

  for (const term of terms) {
    if (nameWords.includes(term)) {
      matched += 1;
    } else if (
      term.length >= 5 &&
      nameWords.some(word =>
        word.length >= 5 && editDistance(term, word) === 1
      )
    ) {
      matched += 0.8;
    }
  }

  return matched / terms.length;
}

function searchProducts(products, query) {
  const category = categoryFrom(query);
  const terms = queryTerms(query);

  if (terms.length) {
    const matches = products
      .map(product => ({
        product,
        score: titleScore(query, product)
      }))
      .filter(item => item.score >= 0.8)
      .sort((a, b) => b.score - a.score);

    if (matches.length) {
      const topScore = matches[0].score;

      return {
        type: 'named',
        products: matches
          .filter(item => item.score >= Math.max(0.8, topScore - 0.15))
          .slice(0, 4)
          .map(item => item.product)
      };
    }

    return { type: 'notfound', products: [] };
  }

  if (category) {
    return {
      type: 'category',
      products: products
        .filter(product => productHasCategory(product, category))
        .slice(0, 6)
    };
  }

  return { type: 'none', products: [] };
}

function listProducts(products, intro) {
  if (!products.length) {
    return 'No encontré productos de esa categoría en el catálogo público actual. Puedes revisar la tienda aquí: ' +
      links.catalogo +
      '\nSi me dices el nombre exacto de la joya, intentaré buscarla por su nombre.';
  }

  return intro + '\n\n' + products.map(product =>
    '• ' + product.title +
    (product.price !== null && product.price > 0
      ? ' — ' + money(product.price)
      : ' — precio por confirmar') +
    (product.available ? '' : ' — no disponible actualmente') +
    '\n' + productUrl(product)
  ).join('\n\n') +
    '\n\nDime cuál te interesa y te doy sus detalles.';
}

function parseBudget(text) {
  const q = normalize(text);

  if (/sin presupuesto|cualquier precio|no importa el precio|sin limite/.test(q)) {
    return 'sin limite';
  }

  const match = q.match(/\d[\d.,]*/);

  if (!match) return '';

  let number = Number(match[0].replace(/[.,]/g, ''));

  if (/\bmil\b|\bk\b/.test(q) && number < 1000) {
    number *= 1000;
  }

  if (/millon/.test(q) && number < 1000000) {
    number *= 1000000;
  }

  return Number.isFinite(number) && number > 0 ? number : '';
}

function isChoiceRequest(q) {
  return /^(quiero ayuda para elegir una joya|ayudame a elegir una joya|quiero elegir una joya|ayuda para elegir|recomiendame una joya|quiero una recomendacion|elegir una joya|ayudame a escoger)$/.test(q);
}

function isGreeting(q) {
  return /^(hola|buenas|buenos dias|buenas tardes|buenas noches|hey|holi)$/.test(q);
}

async function productAnswer(text) {
  const products = await getProducts();
  const result = searchProducts(products, text);

  if (result.type === 'named') {
    if (result.products.length === 1) {
      return productDetails(result.products[0]);
    }

    return 'Encontré varios productos con nombres parecidos. ¿Cuál buscas?\n\n' +
      result.products.map(product =>
        '• ' + product.title + '\n' + productUrl(product)
      ).join('\n\n');
  }

  if (result.type === 'category') {
    return listProducts(
      result.products,
      'Estas son algunas opciones de la categoría que buscas:'
    );
  }

  return 'No encontré una joya cuyo nombre coincida con «' + text +
    '». No quiero darte el precio de otra pieza por error. Puedes revisar el catálogo aquí: ' +
    links.catalogo +
    '\nComprueba cómo aparece escrito el nombre en la tienda y envíamelo de nuevo.';
}

async function send() {
  const text = entry.value.trim();

  if (!text) return;

  add(text, 'user');
  entry.value = '';
  sendButton.disabled = true;

  const q = normalize(text);
  let answer = null;

  try {
    if (isChoiceRequest(q)) {
      recommendation = {
        recipient: '',
        category: '',
        budget: null
      };

      recommendationStep = 'recipient';

      answer = '¡Claro! 💗 Te ayudo a encontrar una joya de SAMELIA. ¿Es para ti o para regalar?';

    } else if (recommendationStep === 'recipient') {
      recommendation.recipient = text;
      recommendationStep = 'category';

      answer = '¡Qué lindo detalle! 🎁 ¿Qué tipo de joya buscas: cadena, collar, aretes, anillo o pulsera? También puedes escribir «sorpréndeme».';

    } else if (recommendationStep === 'category') {
      const category = categoryFrom(q);
      const products = await getProducts();

      if (category) {
        recommendation.category = category;

        const matches = products.filter(product =>
          productHasCategory(product, category)
        );

        answer = listProducts(
          matches.filter(product => product.available).slice(0, 4),
          'Estas son algunas opciones que encontré en el catálogo para ti:'
        );

      } else if (/sorprendeme|cualquiera|no se/.test(q)) {
        recommendation.category = '';

        answer = listProducts(
          products.filter(product => product.available).slice(0, 4),
          'Te muestro algunas joyas disponibles en SAMELIA:'
        );

      } else {
        answer = 'Puedo buscar cadenas, collares, aretes, anillos o pulseras. Escribe el tipo de joya que prefieres y te mostraré las opciones del catálogo.';
        add(answer, 'bot');
        sendButton.disabled = false;
        entry.focus();
        return;
      }

      recommendationStep = 'budget';

      answer += '\n\n¿Tienes un presupuesto aproximado? Por ejemplo, «hasta 50 mil», «hasta 100 mil» o «sin límite».';

    } else if (recommendationStep === 'budget') {
      const budget = parseBudget(text);

      if (!budget) {
        answer = 'Dime tu presupuesto aproximado, por ejemplo «hasta 50000», «hasta 100 mil» o «sin límite». Así puedo filtrar las joyas.';
      } else {
        recommendation.budget = budget;

        const products = await getProducts();

        let matches = products.filter(product =>
          product.available &&
          product.price !== null &&
          product.price > 0
        );

        if (recommendation.category) {
          matches = matches.filter(product =>
            productHasCategory(product, recommendation.category)
          );
        }

        if (budget !== 'sin limite') {
          matches = matches.filter(product =>
            product.price <= Number(budget)
          );
        }

        matches.sort((a, b) => a.price - b.price);

        answer = listProducts(
          matches.slice(0, 4),
          'Estas son las opciones que encajan con tus preferencias y presupuesto:'
        );

        recommendationStep = '';
      }

    } else {
      if (isGreeting(q)) {
        answer = '¡Hola! ✨ Bienvenido a SAMELIA. ¿Buscas una joya para ti o para regalar?';

      } else if (/envio|envios|entrega|domicilio|transportadora|coordinadora/.test(q)) {
        answer = '🚚 Enviamos a Colombia. El envío es gratis en compras desde $150.000 COP; para compras inferiores cuesta $12.900 COP. El plazo estimado es de 10 días hábiles desde la confirmación del pago. Consulta las condiciones: ' + links.envios;

      } else if (/contraentrega|metodos de pago|formas de pago|como puedo pagar|como se paga|pse|nequi|daviplata|visa|mastercard|american express|tarjeta|efectivo/.test(q)) {
        answer = '💳 Puedes pagar con tarjetas Visa, Mastercard y American Express, además de Nequi, Daviplata y PSE. También contamos con pago contraentrega, sujeto a las condiciones del pedido. Consulta: ' + links.terminos;

      } else if (/instagram|redes sociales/.test(q)) {
        answer = '✨ Síguenos en Instagram para descubrir diseños y novedades: ' + links.instagram;

      } else if (/privacidad|datos personales/.test(q)) {
        answer = '🔒 Consulta nuestra política de privacidad aquí: ' + links.privacidad;

      } else if (/devolucion|devolver|reembolso|garantia|defecto/.test(q)) {
        answer = '💗 Consulta nuestra política de reembolsos y las condiciones aplicables aquí: ' + links.reembolsos + '\nSi necesitas ayuda con tu caso, escríbenos: ' + links.whatsapp;

      } else if (/cuidar|cuidado|limpiar|limpieza|se oscurece/.test(q)) {
        answer = '✨ Guarda tus joyas secas y por separado, evita perfumes y productos químicos, y límpialas suavemente con un paño especial. La plata 925 puede oscurecerse naturalmente con el tiempo.';

      } else if (/material|plata|925|oro laminado|piedra natural|piedras preciosas/.test(q)) {
        answer = '💎 En SAMELIA hay diseños con distintos materiales. Para confirmar el material de una pieza concreta, dime su nombre exacto y consultaré la ficha. Puedes explorar la colección aquí: ' + links.catalogo;

      } else if (/humano|persona|asesor|asesora|equipo|contacto|whatsapp|hablar con alguien/.test(q)) {
        answer = '💗 Escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;

      } else {
        const category = categoryFrom(q);

        const asksProduct =
          !!category ||
          /cuanto cuesta|cuanto vale|precio|precios|disponible|disponibilidad|stock|producto|catalogo/.test(q);

        if (asksProduct) {
          answer = await productAnswer(text);
        } else {
          answer = 'Puedo ayudarte con envíos, pagos, materiales y productos del catálogo. Para buscar una joya concreta, escribe su nombre; para ver opciones generales, escribe «cadena», «collar», «aretes», «anillo» o «pulsera». También puedes consultar el catálogo: ' +
            links.catalogo +
            '\nAtención personalizada por WhatsApp: ' + links.whatsapp;
        }
      }
    }

  } catch (error) {
    console.error('Error del chatbot SAMELIA:', error);

    answer = 'Ahora mismo no he podido consultar el catálogo de Shopify. Puedes ver los productos directamente aquí: ' +
      links.catalogo +
      '\nSi necesitas confirmar el precio o la disponibilidad de una pieza, escríbenos por WhatsApp: ' +
      links.whatsapp;
  }

  add(answer, 'bot');
  sendButton.disabled = false;
  entry.focus();
}

document.getElementById('form').addEventListener('submit', event => {
  event.preventDefault();
  send();
});
</script>
</body>
</html>
