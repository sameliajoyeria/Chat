
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMELIA Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#ECE8E4;color:#302923}
.chat{width:min(390px,100%);height:620px;max-height:100vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 35px #0002}
.header{background:#ECE8E4;padding:22px 20px;border-bottom:1px solid #ded7d0}
.brand{font-family:Georgia,serif;letter-spacing:4px;font-size:20px}
.subtitle{font-size:12px;margin-top:7px;color:#756a61}
.messages{padding:18px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere;white-space:pre-line}
.bot{background:#F3F0ED;align-self:flex-start}
.user{background:#76604D;color:white;align-self:flex-end}
.msg a{color:#72533d;text-decoration:underline;overflow-wrap:anywhere}
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 12px}
.quick button{background:white;border:1px solid #cfc3b8;border-radius:20px;padding:8px 10px;cursor:pointer;color:#514235;font-size:12px}
.quick button:disabled,.inputrow button:disabled{opacity:.55;cursor:wait}
.inputrow{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}
.inputrow input{flex:1;min-width:0;border:1px solid #ddd;border-radius:22px;padding:12px;font-size:14px}
.inputrow button{border:0;background:#76604D;color:white;border-radius:50%;width:43px;height:43px;cursor:pointer;font-size:18px}
.note{text-align:center;font-size:10px;color:#887e75;padding:0 0 10px}
</style>
</head>

<body>
<div class="chat">
  <header class="header">
    <div class="brand">SAMELIA</div>
    <div class="subtitle">Raíces que trascienden, joyas que perduran.</div>
  </header>

  <main class="messages" id="messages" aria-live="polite">
    <div class="msg bot">¡Hola! Bienvenido a SAMELIA. ✨ Estamos aquí para ayudarte a encontrar una joya especial. ¿Qué te gustaría saber?</div>
  </main>

  <div class="quick">
    <button type="button" onclick="quick('¿Qué materiales utilizan?')">Materiales</button>
    <button type="button" onclick="quick('¿Cómo funcionan los envíos?')">Envíos</button>
    <button type="button" onclick="quick('¿Qué métodos de pago aceptan?')">Pagos</button>
    <button type="button" onclick="quick('Quiero ayuda para elegir una joya')">Elegir una joya</button>
  </div>

  <form class="inputrow" id="form">
    <input id="entry" placeholder="Escribe tu pregunta..." autocomplete="off" required>
    <button id="sendButton" aria-label="Enviar mensaje" type="submit">➤</button>
  </form>

  <div class="note">Atención al cliente · SAMELIA</div>
</div>

<script>
const messages = document.getElementById('messages');
const entry = document.getElementById('entry');
const sendButton = document.getElementById('sendButton');

const links = {
  envios: 'https://samelia.co/policies/shipping-policy',
  reembolsos: 'https://samelia.co/policies/refund-policy',
  terminos: 'https://samelia.co/policies/terms-of-service',
  privacidad: 'https://samelia.co/policies/privacy-policy',
  instagram: 'https://www.instagram.com/samelia.plata925/',
  whatsapp: 'https://wa.me/573144729199',
  catalogo: 'https://samelia.co/collections/all'
};

// Catálogo público de Shopify.
// La consulta se renueva cada 60 segundos.
const SHOPIFY_PRODUCTS_URL = 'https://samelia.co/products.json?limit=250';
const CATALOG_CACHE_MS = 60 * 1000;

let cachedProducts = null;
let catalogFetchedAt = 0;
let catalogRequestInProgress = null;

function add(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  const parts = String(text).split(/(https?:\/\/[^\s]+)/g);

  parts.forEach(part => {
    if (/^https?:\/\//.test(part)) {
      const cleanUrl = part.replace(/[.,!?]+$/, '');
      const a = document.createElement('a');

      a.href = cleanUrl;
      a.textContent = cleanUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      div.appendChild(a);

      const punctuation = part.slice(cleanUrl.length);
      if (punctuation) {
        div.appendChild(document.createTextNode(punctuation));
      }
    } else {
      div.appendChild(document.createTextNode(part));
    }
  });

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function normalize(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function singularize(word) {
  if (word.length > 5 && word.endsWith('tes')) {
    return word.slice(0, -1);
  }
  if (word.length > 5 && word.endsWith('es')) {
    return word.slice(0, -2);
  }
  if (word.length > 4 && word.endsWith('s')) {
    return word.slice(0, -1);
  }
  return word;
}

function tokenList(text) {
  return normalize(text)
    .split(' ')
    .map(singularize)
    .filter(Boolean);
}

function plainDescription(html) {
  const el = document.createElement('div');
  el.innerHTML = String(html || '');

  el.querySelectorAll('script,style,noscript')
    .forEach(node => node.remove());

  return (el.textContent || el.innerText || '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function getShopifyProducts() {
  const now = Date.now();

  if (cachedProducts && now - catalogFetchedAt < CATALOG_CACHE_MS) {
    return cachedProducts;
  }

  if (catalogRequestInProgress) {
    return catalogRequestInProgress;
  }

  catalogRequestInProgress = (async () => {
    const response = await fetch(SHOPIFY_PRODUCTS_URL, {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('Shopify respondió con HTTP ' + response.status);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.products)) {
      throw new Error('Shopify no devolvió una lista válida de productos.');
    }

    cachedProducts = data.products.map(product => {
      const variants = Array.isArray(product.variants)
        ? product.variants
        : [];

      const prices = variants
        .map(v => Number.parseFloat(v.price))
        .filter(n => Number.isFinite(n) && n >= 0);

      const available = variants.some(v => v.available === true);

      const image = product.images && product.images[0]
        ? product.images[0].src
        : '';

      return {
        id: product.id,
        title: product.title || 'Producto SAMELIA',
        handle: product.handle || '',
        description: plainDescription(product.body_html || ''),
        price: prices.length ? Math.min(...prices) : null,
        available,
        variants,
        image,
        tags: Array.isArray(product.tags) ? product.tags.join(' ') : ''
      };
    });

    catalogFetchedAt = Date.now();
    return cachedProducts;
  })();

  try {
    return await catalogRequestInProgress;
  } finally {
    catalogRequestInProgress = null;
  }
}

const PRODUCT_CATEGORY_WORDS = new Set([
  'arete','pendiente','cadena','collar','anillo','pulsera','joya',
  'joyeria','regalo','colgante','dije','tobillera','broche','conjunto','set'
]);

const NON_PRODUCT_WORDS = new Set([
  'que','cual','cuales','como','donde','cuando','cuanto','cuanta',
  'cuantos','cuantas','tiene','tienen','hay','quiero','busco','ver',
  'saber','decir','mostrar','dime','por','para','favor','una','uno',
  'unas','unos','el','la','los','las','de','del','al','y','o','u',
  'en','con','sin','mi','me','te','tu','su','es','son','esta','estan',
  'esto','esa','ese','esas','esos','precio','precios','vale','valen',
  'cuesta','cuestan','costo','costar','valor','material','materiales',
  'plata','925','oro','piedra','piedras','natural','naturales',
  'disponible','disponibilidad','stock','agotado','agotada','venden',
  'vende','comprar','compra','bonita','bonito','elegante','hermosa',
  'hermoso','color','descripcion','detalles','informacion','sobre',
  'producto','productos','utilizan','utiliza','hacen','hace','hola',
  'buenas','buenos','dias','tardes','noches','gracias','ayuda',
  'ayudar','recomienda','recomendar','recomiendas','especial','pagina','web'
]);

function hasSpecificProductName(query, products) {
  const qTokens = new Set(tokenList(query));

  for (const product of products) {
    const titleTokens = tokenList(product.title).filter(token =>
      token.length >= 4 &&
      !PRODUCT_CATEGORY_WORDS.has(token) &&
      !NON_PRODUCT_WORDS.has(token)
    );

    if (titleTokens.some(token => qTokens.has(token))) {
      return true;
    }
  }

  return false;
}

function isProductQuestion(query, products) {
  const q = normalize(query);

  const categoryAsked =
    /\b(aretes?|pendientes?|cadenas?|collares?|anillos?|pulseras?|joyas?|colgantes?|dijes?|tobilleras?|broches?|conjuntos?)\b/.test(q);

  const detailedQuestion =
    /\b(precio|precios|cuanto cuesta|cuanto vale|valor|material|materiales|descripcion|detalles|disponible|disponibilidad|agotado|agotada|stock|composicion|de que esta hecho|de que esta hecha)\b/.test(q);

  return categoryAsked ||
    hasSpecificProductName(query, products) ||
    (detailedQuestion && categoryAsked);
}

function scoreProduct(query, product) {
  const qTokens = [...new Set(
    tokenList(query).filter(t =>
      t.length > 2 && !NON_PRODUCT_WORDS.has(t)
    )
  )];

  const titleTokens = tokenList(product.title);
  const descriptionTokens = tokenList(product.description + ' ' + product.tags);

  let score = 0;

  for (const token of qTokens) {
    if (titleTokens.includes(token)) {
      score += 8;
    } else if (titleTokens.some(t => t.includes(token) || token.includes(t))) {
      score += 5;
    } else if (descriptionTokens.includes(token)) {
      score += 1;
    }
  }

  const normalizedTitle = normalize(product.title);

  if (
    normalize(query).includes(normalizedTitle) ||
    normalizedTitle.includes(normalize(query))
  ) {
    score += 20;
  }

  if (product.available) score += 0.5;

  return score;
}

function moneyCOP(value) {
  return new Intl.NumberFormat('es-CO', {
    style: 'currency',
    currency: 'COP',
    maximumFractionDigits: 0
  }).format(value);
}

function productUrl(product) {
  return product.handle
    ? `https://samelia.co/products/${encodeURIComponent(product.handle)}`
    : links.catalogo;
}

function productDetailsText(product) {
  const lines = [`✨ ${product.title}`];

  if (product.available) {
    if (product.price !== null && product.price > 0) {
      lines.push(`Precio publicado: ${moneyCOP(product.price)}.`);
    } else {
      lines.push('El producto aparece disponible, pero no tiene un precio válido publicado. Te recomendamos confirmar el precio antes de comprar.');
    }
  } else {
    lines.push('Actualmente, Shopify no lo marca como disponible para compra.');

    if (product.price !== null && product.price > 0) {
      lines.push(`Último precio publicado: ${moneyCOP(product.price)}.`);
    } else {
      lines.push('No aparece un precio válido publicado actualmente.');
    }
  }

  if (product.description) {
    const desc = product.description.length > 420
      ? product.description.slice(0, 417).trimEnd() + '…'
      : product.description;

    lines.push(`Descripción: ${desc}`);
  } else {
    lines.push('La ficha no contiene una descripción adicional.');
  }

  lines.push(`Ver producto: ${productUrl(product)}`);

  return lines.join('\n');
}

function answerFromCatalog(query, products) {
  const q = normalize(query);

  const ranked = products
    .map(product => ({
      product,
      score: scoreProduct(query, product)
    }))
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);

  const hasNamedProduct = hasSpecificProductName(query, products);

  const asksForAvailability =
    /disponible|disponibilidad|agotado|agotada|stock|comprar|comprarlo|comprarla/.test(q);

  const asksPriceOrDetails =
    /precio|cuanto cuesta|cuanto vale|valor|material|materiales|descripcion|detalles|de que esta hecho|de que esta hecha/.test(q);

  if (hasNamedProduct && ranked.length) {
    const best = ranked[0].product;

    if (ranked[0].score >= 5) {
      return productDetailsText(best);
    }
  }

  if (asksForAvailability || asksPriceOrDetails) {
    const likely = ranked.filter(item => item.score >= 3).slice(0, 3);

    if (likely.length === 1) {
      return productDetailsText(likely[0].product);
    }

    if (likely.length > 1) {
      return 'Encontré estas coincidencias en el catálogo actual de SAMELIA:\n\n' +
        likely.map(item => {
          const p = item.product;
          const price = p.price !== null && p.price > 0
            ? moneyCOP(p.price)
            : 'precio por confirmar';

          const status = p.available
            ? 'Disponible'
            : 'No disponible actualmente';

          return `• ${p.title} — ${price} (${status})\n${productUrl(p)}`;
        }).join('\n\n') +
        '\n\nDime el nombre exacto de la joya que buscas y te doy más detalles.';
    }
  }

  const categoryMatches = ranked
    .filter(item =>
      item.score >= 3 &&
      item.product.available &&
      item.product.price > 0
    )
    .slice(0, 3);

  if (categoryMatches.length) {
    return 'Estas son algunas opciones disponibles en el catálogo actual de SAMELIA:\n\n' +
      categoryMatches.map(item =>
        `• ${item.product.title} — ${moneyCOP(item.product.price)}\n${productUrl(item.product)}`
      ).join('\n\n') +
      '\n\nSi te interesa una en particular, dime su nombre y te cuento más.';
  }

  if (isProductQuestion(query, products)) {
    return 'No encontré una coincidencia disponible con ese nombre o descripción en el catálogo actual de SAMELIA. Puedes revisar los productos aquí: ' +
      links.catalogo +
      '\nSi me escribes el nombre exacto de la joya, lo intento buscar de nuevo.';
  }

  return null;
}

function quick(text) {
  entry.value = text;
  send();
}

async function send() {
  const text = entry.value.trim();
  if (!text) return;

  add(text, 'user');
  entry.value = '';
  sendButton.disabled = true;

  const q = normalize(text);
  let answer;

  try {
    const products = await getShopifyProducts();
    answer = answerFromCatalog(text, products);
  } catch (error) {
    console.error('No se pudo consultar el catálogo de Shopify:', error);

    const mightBeProductQuestion =
      /aretes?|pendientes?|cadenas?|collares?|anillos?|pulseras?|joyas?|precio|cuanto cuesta|cuanto vale|material|aurenza|aymara|esmeralda|virdis|cadena fe/i.test(q);

    if (mightBeProductQuestion) {
      answer = 'Ahora mismo no pude consultar el catálogo actualizado de Shopify. Puedes ver los productos publicados aquí: ' +
        links.catalogo +
        '\nSi necesitas confirmar precio o disponibilidad de una joya, escríbenos por WhatsApp: ' +
        links.whatsapp;
    }
  }

  if (!answer && /hola|buenas|buenos dias|buenas tardes|buenas noches/.test(q)) {
    answer = '¡Hola! ✨ Bienvenido a SAMELIA. Estamos encantados de ayudarte. ¿Buscas una joya para ti o para regalar?';
  }

  else if (!answer && /material|plata|925|oro laminado|piedra natural|piedras preciosas/.test(q)) {
    answer = 'En SAMELIA encontrarás joyas elaboradas en plata 925, piezas con piedras naturales o preciosas y diseños con oro laminado, según el producto. 💎 Te recomendamos revisar la ficha de la joya para confirmar sus materiales específicos. Puedes ver nuestra colección aquí: ' + links.catalogo;
  }

  else if (!answer && /envio|envios|entrega|llega|domicilio|transportadora|coordinadora|flete|costo de envio|coste de envio/.test(q)) {
    answer = '🚚 ¡En SAMELIA enviamos tus joyas a Colombia! El envío es GRATIS en compras desde $150.000 COP. Para compras inferiores, el costo es de $12.900 COP. La transportadora es Coordinadora y el plazo estimado es de 10 días hábiles desde la confirmación del pago. Para conocer las condiciones completas, consulta nuestra política de envíos: ' + links.envios;
  }

  else if (!answer && /contraentrega|metodos de pago|formas de pago|como puedo pagar|como se paga|pago|pse|nequi|daviplata|visa|mastercard|american express|tarjeta|efectivo/.test(q)) {
    answer = '💳 Puedes pagar con tarjetas Visa, Mastercard y American Express, además de Nequi, Daviplata y PSE. También contamos con pago contraentrega. La disponibilidad y las condiciones pueden depender de tu pedido. Consulta los términos de la tienda: ' + links.terminos;
  }

  else if (!answer && /precio|cuanto cuesta|valor|cuanto vale|barato|costosa/.test(q)) {
    answer = '✨ Cada joya tiene su precio indicado en la ficha del producto. Explora nuestra colección para ver los diseños y precios disponibles: ' + links.catalogo;
  }

  else if (!answer && /cambio|devolucion|devolver|reembolso|reembolsar|dinero de vuelta/.test(q)) {
    answer = '💗 Queremos que tengas una buena experiencia con tu compra. Puedes consultar las condiciones y el procedimiento de reembolsos en nuestra política: ' + links.reembolsos +
      '\nSi necesitas ayuda con un caso particular, escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else if (!answer && /garantia|defecto|danada|danado|roto|rota|defectuosa|defectuoso/.test(q)) {
    answer = '💗 Para revisar tu caso y orientarte sobre las condiciones aplicables, consulta nuestra política de reembolsos: ' + links.reembolsos +
      '\nTambién puedes escribirnos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else if (!answer && /cuidar|cuidado|limpiar|limpieza|se oscurece|oscurecio|negra|negro|mancha|manchas/.test(q)) {
    answer = '✨ Consejos para cuidar tus joyas:\n• Guárdalas secas y por separado.\n• Evita el contacto directo con perfumes, cremas, cloro y productos de limpieza.\n• Quítatelas antes de ducharte, nadar o hacer ejercicio.\n• Límpialas suavemente con un paño especial para joyería.\nLa plata 925 puede oscurecerse de forma natural con el tiempo. Si tu pieza tiene piedras o acabados especiales, evita limpiadores abrasivos.';
  }

  else if (!answer && /personaliz|grabado|a medida|hacer una joya/.test(q)) {
    answer = '💎 Por el momento no ofrecemos personalización de joyas. Puedes explorar nuestros diseños disponibles aquí: ' + links.catalogo;
  }

  else if (!answer && /elegir|recomienda|regalo|joya|aretes|pendientes|cadena|collar|anillo|pulsera/.test(q)) {
    answer = '¡Con mucho gusto! 💗 En SAMELIA queremos ayudarte a encontrar una joya especial. Puedes explorar nuestros diseños aquí: ' +
      links.catalogo +
      '\nSi necesitas una recomendación personalizada, escríbenos por WhatsApp y nuestro equipo te ayudará: ' +
      links.whatsapp;
  }

  else if (!answer && /instagram|redes sociales|fotos/.test(q)) {
    answer = '✨ Síguenos en Instagram para descubrir nuestros diseños y novedades: ' + links.instagram;
  }

  else if (!answer && /privacidad|datos personales|informacion personal/.test(q)) {
    answer = '🔒 Puedes consultar cómo tratamos y protegemos la información personal en nuestra política de privacidad: ' + links.privacidad;
  }

  else if (!answer && /terminos|condiciones legales/.test(q)) {
    answer = 'Puedes consultar los términos y condiciones de SAMELIA aquí: ' + links.terminos;
  }

  else if (!answer && /humano|persona|asesor|asesora|equipo|contacto|whatsapp|hablar con alguien|ayuda/.test(q)) {
    answer = '💗 Escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  if (!answer) {
    answer = '¡Gracias por escribir a SAMELIA! 💗 No tengo una respuesta exacta para esa pregunta todavía. Escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  add(answer, 'bot');
  sendButton.disabled = false;
  entry.focus();
}

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  send();
});
</script>
</body>
</html>
