
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMELIA Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#ECE8E4;color:#302923}
.chat{width:min(390px,100%);height:620px;max-height:100vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 35px #0002}
.header{background:#ECE8E4;padding:22px 20px;border-bottom:1px solid #ded7d0}
.brand{font-family:Georgia,serif;letter-spacing:4px;font-size:20px}
.subtitle{font-size:12px;margin-top:7px;color:#756a61}
.messages{padding:18px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:14px;max-width:88%;overflow-wrap:anywhere}
.bot{background:#F3F0ED;align-self:flex-start}
.user{background:#76604D;color:white;align-self:flex-end}
.msg a{color:#72533d;text-decoration:underline;overflow-wrap:anywhere}
.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 12px}
.quick button{background:white;border:1px solid #cfc3b8;border-radius:20px;padding:8px 10px;cursor:pointer;color:#514235;font-size:12px}
.inputrow{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}
.inputrow input{flex:1;min-width:0;border:1px solid #ddd;border-radius:22px;padding:12px;font-size:14px}
.inputrow button{border:0;background:#76604D;color:white;border-radius:50%;width:43px;height:43px;cursor:pointer;font-size:18px}
.note{text-align:center;font-size:10px;color:#887e75;padding:0 0 10px}
</style>
</head>

<body>
<div class="chat">
  <header class="header">
    <div class="brand">SAMELIA</div>
    <div class="subtitle">Raíces que trascienden, joyas que perduran.</div>
  </header>

  <main class="messages" id="messages">
    <div class="msg bot">¡Hola! Bienvenido a SAMELIA. ✨ Estamos aquí para ayudarte a encontrar una joya especial. ¿Qué te gustaría saber?</div>
  </main>

  <div class="quick">
    <button type="button" onclick="quick('¿Qué materiales utilizan?')">Materiales</button>
    <button type="button" onclick="quick('¿Cómo funcionan los envíos?')">Envíos</button>
    <button type="button" onclick="quick('¿Qué métodos de pago aceptan?')">Pagos</button>
    <button type="button" onclick="quick('Quiero ayuda para elegir una joya')">Elegir una joya</button>
  </div>

  <form class="inputrow" id="form">
    <input id="entry" placeholder="Escribe tu pregunta..." autocomplete="off" required>
    <button aria-label="Enviar mensaje" type="submit">➤</button>
  </form>

  <div class="note">Atención al cliente · SAMELIA</div>
</div>

<script>
const messages = document.getElementById('messages');
const entry = document.getElementById('entry');

const links = {
  envios: 'https://samelia.co/policies/shipping-policy',
  reembolsos: 'https://samelia.co/policies/refund-policy',
  terminos: 'https://samelia.co/policies/terms-of-service',
  privacidad: 'https://samelia.co/policies/privacy-policy',
  instagram: 'https://www.instagram.com/samelia.plata925/',
  whatsapp: 'https://wa.me/573144729199',
  catalogo: 'https://samelia.co/collections/all'
};

function add(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  // Convierte las direcciones web en enlaces clicables.
  const parts = text.split(/(https?:\/\/[^\s]+)/g);

  parts.forEach(part => {
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement('a');
      a.href = part.replace(/[.,!?]+$/, '');
      a.textContent = a.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      div.appendChild(a);

      const punctuation = part.slice(a.href.length);
      if (punctuation) div.appendChild(document.createTextNode(punctuation));
    } else {
      div.appendChild(document.createTextNode(part));
    }
  });

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function quick(text) {
  entry.value = text;
  send();
}

function send() {
  const text = entry.value.trim();
  if (!text) return;

  add(text, 'user');
  entry.value = '';

  const q = text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let answer;

  if (/hola|buenas|buenos dias|buenas tardes|buenas noches/.test(q)) {
    answer = '¡Hola! ✨ Bienvenido a SAMELIA. Estamos encantados de ayudarte. ¿Buscas una joya para ti o para regalar?';
  }

  else if (/material|plata|925|oro laminado|piedra natural|piedras preciosas/.test(q)) {
    answer = 'En SAMELIA encontrarás joyas elaboradas en plata 925, piezas con piedras naturales o preciosas y diseños con oro laminado, según el producto. 💎 Te recomendamos revisar la ficha de la joya para confirmar sus materiales específicos. Puedes ver nuestra colección aquí: ' + links.catalogo;
  }

  else if (/envio|envios|entrega|llega|domicilio|transportadora|coordinadora|flete|costo de envio|coste de envio/.test(q)) {
    answer = '🚚 ¡En SAMELIA enviamos tus joyas a Colombia! El envío es GRATIS en compras desde $150.000 COP. Para compras inferiores, el costo es de $12.900 COP. La transportadora es Coordinadora y el plazo estimado es de 10 días hábiles desde la confirmación del pago. Para conocer las condiciones completas, consulta nuestra política de envíos: ' + links.envios;
  }

  else if (/contraentrega|metodos de pago|formas de pago|como puedo pagar|como se paga|pago|pse|nequi|daviplata|visa|mastercard|american express|tarjeta|efectivo/.test(q)) {
    answer = '💳 Puedes pagar con tarjetas Visa, Mastercard y American Express, además de Nequi, Daviplata y PSE. También contamos con pago contraentrega. La disponibilidad y las condiciones pueden depender de tu pedido. Consulta los términos de la tienda: ' + links.terminos;
  }

  else if (/precio|cuanto cuesta|valor|cuanto vale|barato|costosa/.test(q)) {
    answer = '✨ Cada joya tiene su precio indicado en la ficha del producto. Explora nuestra colección para ver los diseños y precios disponibles: ' + links.catalogo;
  }

  else if (/cambio|devolucion|devolver|reembolso|reembolsar|dinero de vuelta/.test(q)) {
    answer = '💗 Queremos que tengas una buena experiencia con tu compra. Puedes consultar las condiciones y el procedimiento de reembolsos en nuestra política: ' + links.reembolsos + '\nSi necesitas ayuda con un caso particular, escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else if (/garantia|defecto|danada|danado|roto|rota|defectuosa|defectuoso/.test(q)) {
    answer = '💗 Para revisar tu caso y orientarte sobre las condiciones aplicables, consulta nuestra política de reembolsos: ' + links.reembolsos + '\nTambién puedes escribirnos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else if (/cuidar|cuidado|limpiar|limpieza|se oscurece|oscurecio|negra|negro|mancha|manchas/.test(q)) {
    answer = '✨ Consejos para cuidar tus joyas:\n• Guárdalas secas y por separado.\n• Evita el contacto directo con perfumes, cremas, cloro y productos de limpieza.\n• Quítatelas antes de ducharte, nadar o hacer ejercicio.\n• Límpialas suavemente con un paño especial para joyería.\nLa plata 925 puede oscurecerse de forma natural con el tiempo. Si tu pieza tiene piedras o acabados especiales, evita limpiadores abrasivos.';
  }

  else if (/personaliz|grabado|a medida|hacer una joya/.test(q)) {
    answer = '💎 Por el momento no ofrecemos personalización de joyas. Puedes explorar nuestros diseños disponibles aquí: ' + links.catalogo;
  }

  else if (/elegir|recomienda|regalo|joya|aretes|pendientes|cadena|collar|anillo|pulsera/.test(q)) {
    answer = '¡Con mucho gusto! 💗 En SAMELIA queremos ayudarte a encontrar una joya especial. Puedes explorar nuestros diseños aquí: ' + links.catalogo + '\nSi necesitas una recomendación personalizada, escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else if (/instagram|redes sociales|fotos/.test(q)) {
    answer = '✨ Síguenos en Instagram para descubrir nuestros diseños y novedades: ' + links.instagram;
  }

  else if (/privacidad|datos personales|informacion personal/.test(q)) {
    answer = '🔒 Puedes consultar cómo tratamos y protegemos la información personal en nuestra política de privacidad: ' + links.privacidad;
  }

  else if (/terminos|condiciones legales/.test(q)) {
    answer = 'Puedes consultar los términos y condiciones de SAMELIA aquí: ' + links.terminos;
  }

  else if (/humano|persona|asesor|asesora|equipo|contacto|whatsapp|hablar con alguien|ayuda/.test(q)) {
    answer = '💗 Escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  else {
    answer = '¡Gracias por escribir a SAMELIA! 💗 No tengo una respuesta exacta para esa pregunta todavía. Escríbenos por WhatsApp y nuestro equipo te ayudará: ' + links.whatsapp;
  }

  setTimeout(() => add(answer, 'bot'), 250);
}

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  send();
});
</script>
</body>
</html>
