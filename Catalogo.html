
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo SAMELIA</title>
</head>
<body>
  <script>
    /*
      CATÁLOGO SAMELIA
      Este archivo almacenará la lógica del catálogo.
      Próximo paso: conectar los productos de Shopify.
    */

    const catalogoSamelia = {
      productos: [],
      categorias: [
        "Anillos",
        "Collares",
        "Cadenas",
        "Pulseras",
        "Aretes",
        "Regalos"
      ]
    };

    // Buscador básico para preparar el catálogo.
    function buscarProductos(consulta) {
      const termino = consulta
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

      return catalogoSamelia.productos.filter(producto =>
        producto.nombre
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .includes(termino)
      );
    }

    // Permite utilizar estas funciones desde otros scripts.
    window.catalogoSamelia = catalogoSamelia;
    window.buscarProductosSamelia = buscarProductos;
  </script>
</body>
</html>
